[package]
name = "pios"
version = "0.8.0"
edition = "2024"
description = "Display and monitoring for the Pebble Raspberry Pi 5"
license = "MIT"
publish = false

[features]
# Laptop-only live preview window. Never enabled for the Pi build.
preview = ["dep:minifb"]

[dependencies]
ab_glyph = "0.2"
libc = "0.2"
minifb = { version = "0.29", optional = true }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
