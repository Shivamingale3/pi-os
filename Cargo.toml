[package]
name = "pios"
version = "0.1.0"
edition = "2024"
description = "Display and monitoring for the Pebble Raspberry Pi 5"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
