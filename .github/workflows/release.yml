name: Release

# Push a tag that matches Cargo.toml's version, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the Cargo.toml version
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml ($version)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - run: cargo test --locked
      - run: cargo zigbuild --locked --release --target "$TARGET"

      - name: Package
        run: |
          f="target/$TARGET/release/pios"
          file "$f" | grep -qE "statically linked|static-pie linked"
          mkdir dist
          cp "$f" dist/pios-aarch64-linux-musl
          cd dist
          sha256sum pios-aarch64-linux-musl > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "PiOS $GITHUB_REF_NAME" \
            --generate-notes
